name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system tools (ffmpeg for the media tests; they skip without it)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Repository rules (no emoji, no analytics hosts, no non-local URLs in code)
        run: python tools/check_repo_rules.py

      - name: Fixtures are up to date
        run: python tools/make_fixtures.py --check

      - name: Tests
        # Tests that need the native libjl_auth.so (unicorn emulation) skip themselves: the library is not in the repository.
        run: pytest -q

      - name: No vendor calls (explicit)
        run: pytest -q tests/test_no_vendor_calls.py
